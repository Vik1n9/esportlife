<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1420">
<title>電競人生：LoL 職業選手生涯模擬</title>
<meta name="description" content="從 S2（2012）開始，一場種子化的 LoL 電競選手生涯模擬。校園→青訓→主場賽區→海外→世界賽，版本、英雄池、轉會、解散、特質合成——每一個決定都算數。">
<meta property="og:type" content="website">
<meta property="og:title" content="電競人生：LoL 職業選手生涯模擬">
<meta property="og:description" content="從 S2 打到 30+，版本、英雄池、轉會、解散與特質合成交織的電競生涯。">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<div id="start">
  <div class="wrap">
    <div class="nexus" aria-hidden="true"></div>
    <h1>電競人生<br><em>LoL 職業選手生涯模擬</em></h1>
    <p class="sub">S2（2012）入行 → 青訓 → 主場賽區（GPL／LMS／PCS／LCP）→ 海外 → 世界賽。版本、英雄池、轉會、解散，每一顆骰子都算數。</p>

    <button class="btn resume" id="btn-resume" hidden>
      <span>▸ 繼續上次的生涯</span><small></small>
    </button>

    <div class="field">
      <label for="name-input">選手 ID</label>
      <input id="name-input" maxlength="12" placeholder="例如：Faker" autocomplete="off">
    </div>

    <div class="field">
      <label id="pos-label">位置</label>
      <div class="seg" id="seg-pos" role="group" aria-labelledby="pos-label"></div>
    </div>

    <button class="btn main start" id="btn-start">開始生涯 ▸ S2 春季</button>

    <p class="seedline">
      世界種子
      <input id="seed-input" maxlength="24" aria-label="世界種子">
      · <a href="#" id="seed-reroll">換一個</a>
      <br>相同種子＋相同選擇＝相同人生（可直接輸入朋友的種子碼）
    </p>
  </div>
  <div id="ver-badge"></div>
</div>

<div id="app">
  <header id="board" hidden>
    <div id="bd-top">
      <div id="bd-name"></div>
      <div id="bd-team"></div>
      <button id="btn-panel" title="選手資料">☰</button>
      <button id="btn-restart" title="重新開始">↺</button>
    </div>
    <div id="bd-grid">
      <div class="bd-cell"><b id="bd-age">16</b><span>歲</span></div>
      <div class="bd-cell"><b id="bd-year">2012</b><span>年份</span></div>
      <div class="bd-cell"><b id="bd-ovr">0</b><span>綜合</span></div>
      <div class="bd-cell"><b id="bd-sal">0</b><span>生涯薪資</span></div>
    </div>
    <div id="lamps">
      <span class="lamp"><i></i>訓練</span>
      <span class="lamp"><i></i>賽季</span>
      <span class="lamp"><i></i>休賽</span>
    </div>
  </header>

  <main id="log"></main>

  <button id="act-toggle" style="display:none">⌄ 收合選項</button>
  <footer id="act" hidden></footer>
</div>

<div id="panel">
  <div class="panel-sheet">
    <div class="panel-head">
      <h3>選手資料</h3>
      <button id="panel-close" aria-label="關閉">✕</button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
